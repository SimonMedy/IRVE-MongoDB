name: CI

on:
  push:
    branches:
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src scripts app

      - name: Check dependencies
        run: >-
          python -c "import pandas, pymongo, dotenv, streamlit, matplotlib; print('Dependencies OK')"

      - name: Check project modules
        run: >-
          python -c "import src.config, src.database, src.crud, src.queries; print('Project imports OK')"
